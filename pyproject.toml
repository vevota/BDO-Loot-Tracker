[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "bdo-loot-tracker"
version = "0.3.0"
description = "Real-time loot tracking overlay for Black Desert Online"
authors = [
    {name = "janhnguyen"},
    {name = "vevota", email = "vevota@users.noreply.github.com"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0.0",
    "pystray>=0.19.5",
    "requests>=2.31.0",
    "pytesseract>=0.3.10",
    "python-dotenv>=1.0.1",
    "opencv-python-headless>=4.8.0",
    "PySide6>=6.7.0",
]

[project.urls]
Repository = "https://github.com/vevota/BDO-Loot-Tracker"
